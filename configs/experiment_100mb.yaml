model:
  name: lore_m3
  n_layers: 20
  layer_schedule: mamba3_5to1
  d_model: 512
  n_heads: 8
  n_kv_heads: 2
  head_dim: 64
  d_state: 128
  expand: 2
  mlp_ratio: 2.875
  ssm: mamba3
  ssm_variant: siso
  ssm_backend: pytorch
  ssm_scan: parallel
  mamba_post_gate_norm: true
  attention_pos: rope
  attn_window: 512
  qk_norm: true
  tie_embeddings: true
  max_seq_len: 1024
tokenizer:
  backend: hf
  vocab_size: 32768
train:
  micro_batch: 4
  seq_len: 1024
  grad_accum: 8
  lr: 3.0e-4
  warmup_steps: 200
  max_steps: 20000
  weight_decay: 0.1
  device: mps
  amp: true
  grad_checkpoint: true
  seed: 42
  val_fraction: 0.05
  log_every: 50
  save_every: 500
  mlflow_experiment: lore-m3-experiment-100mb
data:
  shard: artifacts/shards/experiment_100mb.jsonl
  smoke_files:
    - data/jsonl/llm_training_dataset.jsonl.json
  source_for_shard: data/jsonl/openhermes2_5.jsonl
  eval_holdout: data/jsonl/A_to_Z.jsonl.json
  max_chars_per_example: 16000
paths:
  tokenizer_dir: artifacts/tokenizer
  tokens_dir: artifacts/tokens
  checkpoint_dir: artifacts/checkpoints/lore-m3
